<form hx-post="{{ object.cancel_url }}"
      hx-target="#status-{{ object.pk }}"
      hx-select="#status-{{ object.pk }}"
      hx-swap="outerHTML"
      class="d-inline">
    {% csrf_token %}
    <input type="hidden" name="status" value="{{ object.StatusChoices.CANCELLED }}">
    <button type="submit"
            title="Cancel"
            class="btn btn-danger ml-0">
        <i class="fas fa-fw fa-times-circle mr-1"></i>Cancel submission
    </button>
</form>
