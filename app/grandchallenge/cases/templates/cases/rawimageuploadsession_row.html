{% load humanize %}
{% load copy_button %}

{{ object.pk|copy_button:object.get_absolute_url }}
<split></split>

{{ object.created|naturaltime }}
<split></split>

<span class="badge
    {% if object.status == object.FAILURE or object.status == object.CANCELLED %}
        bg-danger
    {% elif object.status == object.RETRY %}
        bg-warning
    {% elif object.status == object.SUCCESS %}
        bg-success
    {% else %}
        bg-info
    {% endif %}">
        {{ object.get_status_display }}
</span>
<split></split>

{{ object.error_message }}
<split></split>
