name: Dependency Update

on:
    schedule:
        - cron: "27 1 * * 2"
    workflow_dispatch:

env:
    PYTHON_VERSION: "3.14"

concurrency:
    group: ${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    dependency-update:
        name: Dependency Update
        runs-on: ubuntu-26.04-arm
        steps:
            - name: Generate a token
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ secrets.DEPENDENCY_UPDATE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.DEPENDENCY_UPDATE_APP_PRIVATE_KEY }}
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  ref: ${{ github.head_ref }}
            - name: Install uv and set the python version
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                python-version: ${{ env.PYTHON_VERSION }}
            - name: Update Dependencies
              id: dependency-update
              timeout-minutes: 5
              run: |
                  LOCK_OUTPUT=$(
                    uv lock --upgrade --no-progress 2>&1
                    uv lock --upgrade --no-progress virtualenvs/biom 2>&1
                    uv lock --upgrade --no-progress virtualenvs/panimg 2>&1
                  )
                  echo "LOCK_OUTPUT<<EOF" >> $GITHUB_ENV
                  echo "$LOCK_OUTPUT" >> $GITHUB_ENV
                  echo "EOF" >> $GITHUB_ENV
            - name: Create Pull Request
              uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  commit-message: "Update dependencies"
                  committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
                  author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
                  branch-suffix: "short-commit-hash"
                  delete-branch: true
                  title: "Update dependencies"
                  body: |
                    Automated dependency update:

                    ```
                    ${{ env.LOCK_OUTPUT }}
                    ```
