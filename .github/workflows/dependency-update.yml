name: Dependency Update

on:
    schedule:
        - cron: "27 1 * * 2"
    workflow_dispatch:

env:
    PYTHON_VERSION: "3.14"

concurrency:
    group: ${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    dependency-update:
        name: Dependency Update
        runs-on: ubuntu-26.04-arm
        steps:
            - name: Generate a token
              id: app-token
              uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
              with:
                  client-id: ${{ secrets.DEPENDENCY_UPDATE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.DEPENDENCY_UPDATE_APP_PRIVATE_KEY }}
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  ref: ${{ github.head_ref }}
            - name: Install uv and set the python version
              uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json
            - name: Update Dependencies
              id: dependency-update
              timeout-minutes: 5
              run: |
                  LOCK_OUTPUT=$(
                    uv lock --upgrade --no-progress 2>&1
                    uv lock --upgrade --no-progress --project virtualenvs/biom 2>&1
                    npm update --package-lock-only --ignore-scripts --min-release-age=7 2>&1
                  )
                  echo "LOCK_OUTPUT<<EOF" >> $GITHUB_ENV
                  echo "$LOCK_OUTPUT" >> $GITHUB_ENV
                  echo "EOF" >> $GITHUB_ENV
            - name: Create Pull Request
              uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  commit-message: "Update dependencies"
                  committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
                  author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
                  branch-suffix: "short-commit-hash"
                  delete-branch: true
                  title: "Update dependencies"
                  body: |
                      Automated dependency update:

                      ```
                      ${{ env.LOCK_OUTPUT }}
                      ```
