<form hx-post="{{ object.status_update_url }}"
      hx-target="#status-{{ object.pk }}"
      hx-select="#status-{{ object.pk }}"
      hx-swap="outerHTML">
    {% csrf_token %}
    <div>
        <input type="hidden" name="status" value="{{ object.StatusChoices.ACCEPTED }}">
        <p>This submission was rejected with the following message. You may edit it below before accepting this
            submission.</p>
        <label for="status_message">Reason for rejection:</label>
        <textarea name="status_message" placeholder="Reason for rejection">{{ object.status_message }}</textarea>
    </div>
    <button type="button" hx-get="{{ object.status_url }}" hx-target="#status-{{ object.pk }}" hx-swap="outerHTML"
            class="btn btn-secondary ml-0">Cancel</button>
    <button type="submit"
            title="Accept"
            class="btn btn-success ml-0"
    >
        <i class="fas fa-fw fa-check-circle mr-1"></i>Accept
    </button>
</form>
