name: Dependency Update

on:
    schedule:
        - cron: "27 1 * * 2"
    workflow_dispatch:

env:
    PYTHON_VERSION: "3.13"

concurrency:
    group: ${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    dependency-update:
        name: Dependency Update
        runs-on: ubuntu-latest
        steps:
            - name: Generate a token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ secrets.DEPENDENCY_UPDATE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.DEPENDENCY_UPDATE_APP_PRIVATE_KEY }}
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  ref: ${{ github.head_ref }}
            - name: Install Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install uv and pre-commit
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install uv pre-commit virtualenv!=20.0.6
            - name: Update Dependencies
              id: dependency-update
              timeout-minutes: 5
              run: |
                  LOCK_OUTPUT=$(uv lock --upgrade --no-progress 2>&1)
                  echo "LOCK_OUTPUT<<EOF" >> $GITHUB_ENV
                  echo "$LOCK_OUTPUT" >> $GITHUB_ENV
                  echo "EOF" >> $GITHUB_ENV
            - uses: actions/setup-node@v6
              with:
                node-version: 24
            - name: Update npm lockfile
              run: |
                rm package-lock.json
                npm install --package-lock-only
            - name: Build the test container, make the docs and migrations
              run: |
                  make build_web_test
                  make docs
                  make migrations
            - name: Format the migrations
              # pre-commit will exit with code 1 when the files change, this is OK
              continue-on-error: true
              run: |
                  git add .
                  pre-commit run --all-files
            - name: Create Pull Request
              uses: peter-evans/create-pull-request@v8
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  commit-message: "Update dependencies"
                  branch-suffix: "short-commit-hash"
                  delete-branch: true
                  title: "Update dependencies"
                  body: |
                    Automated dependency update:

                    ```
                    ${{ env.LOCK_OUTPUT }}
                    ```
