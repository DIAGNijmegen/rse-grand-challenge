<a href="#civModal-{{ civ.pk }}"
   data-bs-toggle="modal"
   data-bs-target="#civModal-{{ civ.pk }}"
   class="btn btn-primary badge"
   role="button"
   title="View {{ civ.interface.title }}"
>
    <i
            class="fas fa-fw fa-eye"
    ></i>
    {{ civ.interface.title|truncatechars:64 }}
    {% block preview %}{% endblock %}
</a>

<div class="modal" id="civModal-{{ civ.pk }}" tabindex="-1" role="dialog"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    {{ civ.interface.title }}
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"
                        aria-label="Close">
                </button>
            </div>
            <div class="text-start modal-body">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
</div>
