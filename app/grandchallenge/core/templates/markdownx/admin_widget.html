<div class="gc-md-admin">
    <div class="gc-md-tabs" role="tablist">
        <button type="button" class="gc-md-tab gc-md-tab-active" role="tab" id="editor-tab-{{ widget.attrs.id }}" data-gc-md-target="editor-{{ widget.attrs.id }}" aria-controls="editor-{{ widget.attrs.id }}" aria-selected="true">Editor</button>
        <button type="button" class="gc-md-tab" role="tab" id="preview-tab-{{ widget.attrs.id }}" data-gc-md-target="preview-{{ widget.attrs.id }}" aria-controls="preview-{{ widget.attrs.id }}" aria-selected="false">Preview</button>
    </div>
    <div class="markdownx">
        <div class="gc-md-panel" id="editor-{{ widget.attrs.id }}" role="tabpanel" aria-labelledby="editor-tab-{{ widget.attrs.id }}">
            {% include "markdownx/partials/toolbar.html" %}
            {% include "markdownx/partials/textarea.html" %}
            {% include "markdownx/partials/notes.html" %}
        </div>
        <div class="gc-md-panel" id="preview-{{ widget.attrs.id }}" role="tabpanel" aria-labelledby="preview-tab-{{ widget.attrs.id }}" hidden>
            <div class="markdownx-preview"></div>
        </div>
    </div>
</div>
